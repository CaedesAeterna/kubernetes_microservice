<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Media - Media Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-5">
        <div class="container">
            <a class="navbar-brand" href="/">Media Tracker</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h3 class="mb-0">Add New Media to Catalog</h3>
                    </div>
                    <div class="card-body">
                        <form action="/media" method="post">
                            <div class="mb-3">
                                <label class="form-label">Title</label>
                                <input type="text" name="title" class="form-control" required placeholder="e.g. Breaking Bad">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Type</label>
                                <select name="media_type" class="form-select">
                                    <option value="Anime">Anime</option>
                                    <option value="Manga">Manga</option>
                                    <option value="Web Novel">Web Novel</option>
                                    <option value="Light Novel">Light Novel / Novel</option>
                                    <option value="Book">Book (Physical/General)</option>
                                    <option value="Movie">Movie</option>
                                    <option value="Series">TV Series</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <textarea name="description" class="form-control" rows="3"></textarea>
                            </div>
                            <div class="d-flex justify-content-between">
                                <a href="/media" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary">Add to Catalog</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
